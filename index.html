<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Portal System | Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        font-family: "DM Sans", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      }
      .top-bar {
        background: #37312e;
        color: #fff;
        font-size: 0.95rem;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
      }
      .hero {
        min-height: 100vh;
        padding-top: 52px; /* space for fixed top bar */
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.62), rgba(0, 0, 0, 0.62)),
          url("images/bg.png") center/cover no-repeat;
      }
      .hero-inner {
        min-height: calc(100vh - 52px);
      }
      .hero-title {
        font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
        font-size: clamp(42px, 4.8vw, 72px);
        letter-spacing: 0.4px;
        line-height: 1.06;
      }
      .hero-kicker {
        letter-spacing: 0.22em;
        text-transform: uppercase;
        font-size: 0.95rem;
      }
      .kicker-line {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        opacity: 0.95;
      }
      .kicker-line::before,
      .kicker-line::after {
        content: "";
        height: 1px;
        width: clamp(80px, 18vw, 240px);
        background: rgba(255, 255, 255, 0.7);
      }
      .brand-mark {
        width: 44px;
        height: 44px;
        border: 2px solid rgba(255, 255, 255, 0.9);
        border-radius: 14px;
        display: grid;
        place-items: center;
      }
      .brand-mark span {
        color: #fff;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .hero-logo {
        width: auto;
        max-width: min(820px, 86vw);
        max-height: 360px;
        height: auto;
        filter: none;
        opacity: 0.96;
        display: block;
        margin: 0 auto;
      }
      .btn-square {
        border-radius: 0 !important;
      }
    </style>
  </head>

  <body data-page="login">
    <!-- Top bar (navbar on top) -->
    <div class="top-bar">
      <div class="container-fluid px-5 py-2">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
          <div>Get Directions on Campus</div>

          <div class="d-flex align-items-center gap-3">
            <span class="me-3">+63 966 381 6462</span>
            <a href="#" class="text-white" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
            <a href="#" class="text-white" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
            <a href="#" class="text-white" aria-label="YouTube"><i class="bi bi-youtube"></i></a>
          </div>
        </div>
      </div>
    </div>

    <!-- Login / Hero -->
    <main class="hero">
      <div class="container hero-inner d-flex flex-column justify-content-center align-items-center text-center text-white py-5">
        <img class="hero-logo mb-3" src="images/logo-white.png" alt="CBT University of Film and Media Arts Logo" />

        <div class="hero-kicker kicker-line mb-3">Film and Media Arts</div>
        <h1 class="hero-title fw-normal mb-4">Every Vision Begins in a Frame.</h1>
        <a href="dashboard.html" class="btn btn-light btn-lg px-5 btn-square fw-semibold">
          LOG IN STUDENT ACCOUNT
        </a>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/portal.js"></script>
  </body>
</html>
