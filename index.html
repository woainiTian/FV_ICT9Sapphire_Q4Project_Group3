<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Page | CBT University</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- icon-->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <!-- fontss -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
    />
<style>
    body{
        height: 100%;
        font-family: "Montserrat", system-ui, Arial, sans-serif;
      }

      .nav-bar{
        background: #37312e;
        color: #fff;
        font-size: 0.95rem;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
      }
      .hero {
        min-height: 100vh;
        padding-top: 52px;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.62), rgba(0, 0, 0, 0.62)),
          url("images/landingbg.png") center/cover no-repeat;
      }
      .hero-title {
        font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
        font-size: clamp(42px, 4.8vw, 72px);
        letter-spacing: 0.4px;
        line-height: 1.06;
      }
      .kicker-line {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .kicker-line::before,
      .kicker-line::after {
        content: "";
        height: 1px;
        width: clamp(80px, 18vw, 240px);
        background: rgba(255, 255, 255, 0.7);
      }

      .hero-logo {
        width: auto;
        max-height: 700px;
        height: auto;
        display: block;
        margin-top: -40px;
      }

      footer{
       position: fixed;
       bottom: 0px;
       width: 100%;
       text-align: center;
       color: #ffffff;
       font-size: 12px;
       background-color: #2f2a28;
       opacity: 90%;
       }

    </style>
  </head>

  <body>
    <!-- navbar -->
    <div class="nav-bar">
      <div class="container-fluid px-5 py-2">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
          <div>Get Directions on Campus</div>

          <div class="d-flex align-items-center gap-3">
            <span class="me-3">+63 000 000 0000</span>
            <a href="#" class="text-white" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
            <a href="#" class="text-white" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
            <a href="#" class="text-white" aria-label="YouTube"><i class="bi bi-youtube"></i></a>
          </div>
        </div>
      </div>
    </div>

    <!-- Hero, login smth smth -->
    <main class="hero">
      <div class="container hero-inner d-flex flex-column justify-content-center align-items-center text-center text-white py-5">
        <img class="hero-logo mb-3" src="images/logo-white.png" alt="CBT University of Film and Media Arts Logo" />
    
      <!-- kickerr, the big stuff in the center of the thing-->
        <div class="hero-kicker kicker-line mb-3">Film and Media Arts</div>
        <h1 class="hero-title fw-normal mb-4">Every Vision Begins in a Frame.</h1>
        <br><br>
      <!-- the button for the login-->
        <a href="login.html" class="btn btn-light btn-lg px-5 btn-square fw-semibold">
          LOG IN STUDENT ACCOUNT
        </a>
      </div>
    </main>

  <!-- footerr -->
  <footer>
    © Copyright Cabading, Bermudez, Tian | 9 Sapphire
  </footer>

  </body>
</html>
