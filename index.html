<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Portal System | Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        font-family: "Montserrat", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      }
      .top-bar {
        background: rgba(0, 0, 0, 0.78);
        color: #fff;
        font-size: 0.95rem;
      }
      .hero {
        min-height: calc(100vh - 44px);
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.62), rgba(0, 0, 0, 0.62)),
          url("YOUR_IMAGE_HERE.jpg") center/cover no-repeat;
      }
      .hero-title {
        font-size: clamp(42px, 4.8vw, 72px);
        letter-spacing: 0.4px;
        line-height: 1.06;
      }
      .hero-kicker {
        letter-spacing: 0.22em;
        text-transform: uppercase;
        font-size: 0.95rem;
      }
      .brand-mark {
        width: 44px;
        height: 44px;
        border: 2px solid rgba(255, 255, 255, 0.9);
        border-radius: 14px;
        display: grid;
        place-items: center;
      }
      .brand-mark span {
        color: #fff;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .pill {
        border-radius: 999px;
      }
      .footer {
        background: #101013;
        color: rgba(255, 255, 255, 0.92);
      }
      .footer a {
        color: rgba(255, 255, 255, 0.92);
        text-decoration: underline;
      }
    </style>
  </head>

  <body data-page="login">
    <!-- Top bar (navbar on top) -->
    <div class="top-bar">
      <div class="container-fluid px-5 d-flex justify-content-between align-items-center flex-wrap py-2">
        <div>Get Directions on Campus</div>

        <div class="d-flex align-items-center gap-3">
          <span class="me-3">+63 966 381 6462</span>
          <a href="#" class="text-white me-2" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
          <a href="#" class="text-white me-2" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
          <a href="#" class="text-white" aria-label="YouTube"><i class="bi bi-youtube"></i></a>
        </div>
      </div>
    </div>

    <!-- Login / Hero -->
    <main class="hero d-flex align-items-center">
      <div class="container hero-inner py-5">
        <div class="row justify-content-center">
          <div class="col-lg-10 text-center text-white">
            <div class="d-flex justify-content-center mb-4">
              <div class="brand-mark">
                <span>SP</span>
              </div>
            </div>

            <div class="hero-kicker mb-3">Student Portal System</div>
            <h1 class="hero-title fw-normal mb-4">Every Lesson Builds a Future.</h1>
            <p class="mx-auto mb-5" style="max-width: 760px; opacity: 0.92;">
              Log in to your student account to access your portal.
            </p>

            <a href="dashboard.html" class="btn btn-light btn-lg px-5 pill fw-semibold">
              LOG IN STUDENT ACCOUNT
            </a>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer py-3">
      <div class="container text-center small">
        <div>Cabading, Bermudez &amp; Tian | Grade 9 - Sapphire</div>
        <div>
          Source: <a href="https://www.w3schools.com/" target="_blank" rel="noreferrer">w3schools.com</a> •
          Images: (add your sources here)
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/portal.js"></script>
  </body>
</html>
