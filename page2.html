<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- icon-->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <!-- fontss -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamondx:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
    />
<style>
    body {
        height: 100%;
        font-family: "Montserrat", system-ui, Arial, sans-serif;
      }
      .title{
        font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
        letter-spacing: 0.2px;
        font-size: 70px;
        line-height: 0.95;
        margin: 0;
      }
      .logo{
        width: 300px;
        height: auto;
      }
      .description{
        font-size: 15px;
      }
      .main-id{
        font-weight: 700;
        color: #c48e45;
      }
      .text-input{
        border-radius: 0;
        border: 2px solid;
        height: 44px;
      }
      .login-btn{
        background: #3a3432;
        border: none;
        padding: 14px 18px;
        font-weight: 700;
      }
      .right-panel {
        min-height: 100vh;
      }
      .img-block {
        position: relative;
        background: #cfcfcf;
        background-size: cover;
        background-position: center;
      }
      .img-combined {
        background-image: url("images/login-right.png");
      }
      /* used chatgpt to fix the quote */
      .quote {
        position: absolute;
        left: 50%;
        top: 54%;
        transform: translateX(-50%);
        width: min(86%, 560px);
        background: rgba(0, 0, 0, 0.45);
        color: #fff;
        padding: 14px 16px;
        font-style: italic;
        font-weight: 600;
      }
      .quote .by {
        font-style: normal;
        opacity: 0.85;
        font-weight: 500;
        margin-left: 10px;
        white-space: nowrap;
      }
    </style>
  </head>

  <body>
    <main class="page">
      <div class="frame">
        <div class="row g-0">
          <!-- Left -->
          <div class="col-lg-6 left-panel d-flex align-items-start">
            <div
              class="px-4 px-md-5 py-5 w-100"
              style="max-width: 650px; margin-left: auto; margin-right: auto; padding-top: 110px;"
            >
              <div class="text-center mb-4">
                <img class="logo" src="images/logo-black.png" alt="CBT University of Film and Media Arts" />
                <h1 class="title mt-3">Log In</h1>
              </div>

              <p class="description mb-4">
                Please enter your school account details to log<br />
                in your account.
              </p>

              <form onsubmit="return false;">
                <div class="mb-3">
                  <div class="main-id mb-2">Student ID:</div>
                  <input id="studentId" class="form-control text-input" type="text" placeholder="Enter Student ID" />
                </div>

                <div class="mb-4">
                  <div class="main-id mb-2">Password:</div>
                  <input id="password" class="form-control text-input" type="password" placeholder="Enter Password" />
                </div>

                <div id="loginMsg" class="mt-3 fw-semibold" style="color: #dc3545; display: none;"></div>

                <button id="loginBtn" class="btn btn-dark w-100 btn-square login-btn mt-3" type="button">
                  LOG IN STUDENT ACCOUNT
                </button>

                <div class="text-center mt-3" style="font-style: italic; color: #6c757d;">
                  Forgot your password?
                </div>
              </form>
            </div>
          </div>

          <!-- Right -->
          <div class="col-lg-6 right-panel">
            <div class="d-flex flex-column h-100">
              <div class="img-block img-combined flex-grow-1">
                <div class="quote">
                  "No matter what anybody tells you, words and ideas can change the world."
                  <span class="by">— Dead Poets Society</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const ID = "jjj";
      const PASS = "29112711";

      const msg = document.getElementById("loginMsg");

      let tries = 0;

      document.getElementById("loginBtn").addEventListener("click", () => {
        let ok = false;
        msg.style.display = "none";
        msg.textContent = "";

        do {
          const id = String(document.getElementById("studentId").value || "").trim();
          const pass = String(document.getElementById("password").value || "");

          if (id === ID && pass === PASS) {
            ok = true;
            break;
          }

          tries += 1;
        } while (false);

        if (ok) {
          window.location.href = "dashboard.html";
          return;
        }

        if (tries < 3) {
          msg.style.display = "block";
          msg.textContent = `Incorrect Student ID or Password. Try again. (${tries}/3)`;
          return;
        }

        msg.style.display = "block";
        msg.textContent = "Too many attempts. Please refresh the page and try again.";
        document.getElementById("loginBtn").disabled = true;
        document.getElementById("studentId").disabled = true;
        document.getElementById("password").disabled = true;
      });
    </script>
  </body>
</html>
